[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faceheatmap"
version = "0.1.0"
description = "Gaze-direction heatmaps and face-boundary attention stats for two-person Zoom recordings"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.scripts]
faceheatmap = "faceheatmap.cli:main"

[tool.setuptools.packages.find]
include = ["faceheatmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
